<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Get Calcaloo</title>
  <style>
    :root { --bg: #ffffff; --text: #1b1f24; --muted: #5b6470; --accent: #006874; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111417; --text: #eef1f4; --muted: #a3acb6; --accent: #4fd8e8; }
    }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    .lead { font-size: 1.1rem; color: var(--muted); margin: 0 0 1.5rem; }
    .store { display: block; margin: .75rem auto; padding: .85rem 1.25rem; max-width: 20rem; border-radius: .75rem;
      background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; }
    .soon { display: block; margin: .75rem auto; padding: .85rem 1.25rem; max-width: 20rem; border-radius: .75rem;
      border: 1px solid var(--muted); color: var(--muted); }
    [hidden] { display: none !important; }
    .mascot { width: 160px; height: 160px; margin: 0 auto 1.25rem; padding: 18px; box-sizing: border-box;
      border-radius: 50%; background: #fdf3e7; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    .mascot img { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <main>
    <div class="mascot"><img src="/calcaloo/mascot.svg" alt="Calcaloo mascot" width="124" height="124"></div>
    <h1>Calcaloo</h1>
    <p class="lead">Calorie tracking that feels like a game: streaks, XP and AI photo estimates.</p>
    <a id="ios" class="store" href="https://apps.apple.com/app/id6757434158">Download on the App Store</a>
    <a id="play" class="store" href="#" hidden>Get it on Google Play</a>
    <span id="soon" class="soon">Android — coming soon</span>
  </main>
  <script>
    // Switch to true when Calcaloo 1.2 is live in production on Google Play.
    var PLAY_ENABLED = false;
    var PT = '128407090';
    var APP_ID = '6757434158';
    var PACKAGE = 'com.khrolovich.calorietracker';

    var params = new URLSearchParams(location.search);
    var ct = (params.get('ct') || 'web-get').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'web-get';
    var appStore = 'https://apps.apple.com/app/apple-store/id' + APP_ID + '?pt=' + PT + '&ct=' + encodeURIComponent(ct) + '&mt=8';
    var play = 'https://play.google.com/store/apps/details?id=' + PACKAGE +
      '&referrer=' + encodeURIComponent('utm_source=' + ct + '&utm_medium=social&utm_campaign=launch');

    document.getElementById('ios').href = appStore;
    var playLink = document.getElementById('play');
    playLink.href = play;
    if (PLAY_ENABLED) {
      playLink.hidden = false;
      document.getElementById('soon').hidden = true;
    }

    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (isIOS) {
      location.replace(appStore);
    } else if (isAndroid && PLAY_ENABLED) {
      location.replace(play);
    }
  </script>
</body>
</html>
